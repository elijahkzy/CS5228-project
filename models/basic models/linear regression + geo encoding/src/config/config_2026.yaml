  floor:
    enabled: true                 # controls only band/is_* + cap outputs
    sty_col: MAX_FLOOR
    floor_num_col: FLOOR_NUM
    floor_band_col: FLOOR_BAND
    is_high_floor_col: IS_HIGH_FLOOR
    is_basement_col: IS_BASEMENT

    basement_strategy: to_zero      # to_zero | to_ground | keep | flag
    missing_impute_value: 1
    high_floor_threshold: 11

    cap_enabled: true
    cap_value: 40

    # IMPORTANT: includes band for 0 (so STY<0 -> 0 is categorical-clean)
    bands:
      - { name: B0_OR_BASEMENT, min: 0,  max: 0 }
      - { name: LOW,            min: 1,  max: 4 }
      - { name: MID,            min: 5,  max: 10 }
      - { name: HIGH,           min: 11, max: 20 }
      - { name: VERY_HIGH,      min: 21, max: 40 }
      - { name: SKY,            min: 41, max: null }
