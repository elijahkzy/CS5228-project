# Postal-code geocoding configuration for Singapore HDB rental records.

feature_engineering:
  postcode_transform:
    enabled: true
    postcode_col: POSTAL_CODE

    # Created columns
    sector_col: POSTAL_SECTOR
    district_col: POSTAL_DISTRICT
    region_col: POSTAL_REGION

    # Treat "00" as invalid sector (legacy/invalid postcodes exist)
    invalid_sector_prefixes: ["00"]

    # how regions work:
    # Core Central Region (CCR): The prime downtown core and luxury central districts (mainly Districts 1, 2, 6, 9, 10, and 11).
    # Rest of Central Region (RCR): The mid-tier "urban fringe" areas just outside the primary center (such as Districts 3, 4, 5, 7, 8, 12, 13, 14, 15, and 20).
    # Outside Central Region (OCR): The suburban residential areas spanning the rest of the island (including suburban districts like Bedok, Tampines, Hougang, and Jurong).
    # the .5 is meant to denote the in-between, because some districts lie on the boundaries of the regions
    regions:
      1:
        districts: ["09", "10", "11"]
      1.5:
        districts: ["01", "02", "04", "06", "07"]
      2:
        districts: ["03", "08", "12", "13"]
      2.5:
        districts: ["05", "14", "15", "20"]
      3:
        districts: ["16", "17", "18", "19", "21", "22", "23", "24", "25", "26", "27", "28"]

    postal_districts:
      "01":
        postal_sector: ["01", "02", "03", "04", "05", "06"]
        general_location: ["Raffles Place", "Cecil", "Marina", "People's Park"]
      "02":
        postal_sector: ["07", "08"]
        general_location: ["Anson", "Tanjong Pagar"]
      "03":
        postal_sector: ["14", "15", "16"]
        general_location: ["Queenstown", "Tiong Bahru"]
